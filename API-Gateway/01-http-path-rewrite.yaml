apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: admin-route
  namespace: dev
spec:
  parentRefs:
  - name: traefik-gateway 
    namespace: traefik    # Your Gateway name
    sectionName: http
    kind: Gateway

  hostnames:
  - "192.168.56.22"           # Traefik external IP as host

  rules:
  - matches:
    - path: 
        type: PathPrefix
        value: /admin-api-2
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /   # Rewrites /admin-api/* → /* on service
    backendRefs:
    - name: admin-api-svc
      port: 8091
      weight: 100

